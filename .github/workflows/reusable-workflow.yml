name: Reusable Workflow

on:
  workflow_call:
    inputs:
      terraform_version:
        required: true
        type: string
      gcp_project_id:
        required: true
        type: string
      sa_email:
        required: true
        type: string
      wif_provider:
        required: true
        type: string
      docker_username:
        required: true
        type: string
      docker_password:
        required: true
        type: string

jobs:
  setup:
    name: Setup Environment
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          service_account: ${{ inputs.sa_email }}
          workload_identity_provider: ${{ inputs.wif_provider }}
          
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ inputs.gcp_project_id }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ inputs.terraform_version }}

  terraform:
    name: Provisioning Infrastructure
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      id-token: 'write'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: List Files
        run: ls -la terraform

      - name: Terraform Init
        working-directory: terraform
        run: terraform init
        
      - name: Get Access Token for Terraform
        id: 'auth'
        uses: google-github-actions/auth@v1
        with:
          service_account: ${{ inputs.sa_email }}
          workload_identity_provider: ${{ inputs.wif_provider }}
    
      - name: Terraform Plan
        id: plan
        working-directory: terraform
        run: terraform plan -out=tfplan
        env: 
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        
      - name: Apply Only If Changes Exist
        working-directory: terraform
        run: terraform apply -auto-approve tfplan
        if: ${{ steps.plan.outputs.changes }} == 'true'
        env: 
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ inputs.docker_username }}
          password: ${{ inputs.docker_password }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
            context: .
            file: ./Dockerfile
            tags: ${{ inputs.docker_username }}/simple-api:latest
            push: true

  kubernetes:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      id-token: 'write'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Terraform Init
        working-directory: kubernetes_resource
        run: terraform init
        
      - name: Get Access Token for Terraform
        id: 'auth'
        uses: google-github-actions/auth@v1
        with:
          service_account: ${{ inputs.sa_email }}
          workload_identity_provider: ${{ inputs.wif_provider }}

      - name: Terraform Apply
        working-directory: kubernetes_resource
        run: terraform apply -auto-approve
        env: 
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
